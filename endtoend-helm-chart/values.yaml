# Global settings for your chart
global:
  appName: endtoend-app

# Backend-specific values
backend:
  image:
    repository: end-to-end-project-backend
    tag: latest
  replicas: 2
  containerPort: 5000
  servicePort: 5000
  nodePort: 30001 # Optional if using NodePort service type

# Frontend-specific values
frontend:
  image:
    repository: end-end-project-frontend
    tag: latest
  replicas: 1
  containerPort: 3000
  servicePort: 3000
  nodePort: 30002 # Optional if using NodePort service type

# Ingress settings
ingress:
  enabled: true
  hosts:
    - host: example.local
      paths:
        - path: /
          backendService: frontend
        - path: /api
          backendService: backend
